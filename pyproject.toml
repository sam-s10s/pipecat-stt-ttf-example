[project]
name = "stt-timing"
version = "0.1.0"
description = "wip"
requires-python = ">=3.12"
dependencies = [
    "speechmatics-voice",
    "pipecat-ai[deepgram,runner,silero,speechmatics,webrtc]",
]

[dependency-groups]
dev = [
    "ruff~=0.12.1",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I"]

[tool.uv.sources]
speechmatics-voice = { path = "../../../speechmatics-python-sdk/sdk/voice", editable = true }
pipecat-ai = { path = "../../pipecat", editable = true }
